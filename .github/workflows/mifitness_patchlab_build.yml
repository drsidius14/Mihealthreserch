name: PatchLab - build Mi Fitness 3.59.1 Binder patch

on:
  push:
    branches:
      - mifitness-patchlab-clean
    paths:
      - .github/workflows/mifitness_patchlab_build.yml
      - patchlab/tools/apply_binder_allowlist_patch.py
      - patchlab/tools/verify_binder_allowlist_patch.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/mifitness-patchlab-clean'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout only the clean PatchLab branch
        uses: actions/checkout@v4
        with:
          ref: mifitness-patchlab-clean

      - name: Reassemble and verify original Mi Fitness APK
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/mifitness-patchlab-clean"
          mkdir -p patchlab/input patchlab/work patchlab/output patchlab/report
          shopt -s nullglob
          parts=(patchlab/input-parts/mi_fitness_3.59.1.part-*)
          if [ "${#parts[@]}" -ne 10 ]; then
            echo "ERROR: expected 10 APK parts, found ${#parts[@]}" | tee patchlab/report/STATUS.txt
            exit 1
          fi
          cat "${parts[@]}" > patchlab/input/com.mi.health_3.59.1.apk
          echo '46100649d47000e8886d94cfbb34c18706e492a5d3aaa7f34cd4785841ffc254  patchlab/input/com.mi.health_3.59.1.apk' | sha256sum -c -
          sha256sum patchlab/input/com.mi.health_3.59.1.apk | tee patchlab/report/input-sha256.txt
          test -f patchlab/input/XiaomiHealthResearch_1.4.6_RU_V17_03.apk

      - name: Install APK tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apktool

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Install Android build-tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Verify Research APK signer
        shell: bash
        run: |
          set -euo pipefail
          apksigner verify --print-certs patchlab/input/XiaomiHealthResearch_1.4.6_RU_V17_03.apk | tee patchlab/report/research-certificate.txt
          tr -d ':' < patchlab/report/research-certificate.txt | tr '[:upper:]' '[:lower:]' | grep -q '86666fd4c4ef99a2edba2a50595dc223d0f42b11'

      - name: Decode Mi Fitness and apply exact allowlist patch
        shell: bash
        run: |
          set -euo pipefail
          apktool d -f patchlab/input/com.mi.health_3.59.1.apk -o patchlab/work/mi_fitness
          python3 patchlab/tools/apply_binder_allowlist_patch.py \
            --decoded-root patchlab/work/mi_fitness \
            --report patchlab/report/PATCH-REPORT.txt

      - name: Rebuild and validate patched APK contents
        shell: bash
        run: |
          set -euo pipefail
          apktool b patchlab/work/mi_fitness -o patchlab/work/mi_fitness-unsigned.apk
          zipalign -p -f 4 patchlab/work/mi_fitness-unsigned.apk patchlab/work/mi_fitness-aligned.apk
          apktool d -f patchlab/work/mi_fitness-aligned.apk -o patchlab/work/verify-decoded
          python3 patchlab/tools/verify_binder_allowlist_patch.py \
            --decoded-root patchlab/work/verify-decoded \
            --report patchlab/report/DEX-VALIDATION.txt

      - name: Sign test APK and verify signature
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore patchlab/work/patchlab-test.jks \
            -storepass patchlab-temp-pass -keypass patchlab-temp-pass -alias patchlab-test \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=MiFitness PatchLab Test,O=Mihealthreserch,C=RU"
          apksigner sign --ks patchlab/work/patchlab-test.jks --ks-key-alias patchlab-test \
            --ks-pass pass:patchlab-temp-pass --key-pass pass:patchlab-temp-pass \
            --out patchlab/output/MiFitness_3.59.1_V17.03_BinderPatch_TESTSIGNED.apk \
            patchlab/work/mi_fitness-aligned.apk
          apksigner verify --verbose --print-certs patchlab/output/MiFitness_3.59.1_V17.03_BinderPatch_TESTSIGNED.apk \
            | tee patchlab/report/output-signature-verification.txt
          sha256sum patchlab/output/MiFitness_3.59.1_V17.03_BinderPatch_TESTSIGNED.apk \
            | tee patchlab/report/output-sha256.txt
          printf '%s\n' \
            'STATUS=BUILD_AND_DEX_CHECKS_PASSED' \
            'SIGNING=temporary test key; not the original Xiaomi signer' \
            'INSTALL_NOTE=will not update an official-signed Mi Fitness install in place' \
            > patchlab/report/STATUS.txt

      - name: Upload patched APK and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MiFitness-3.59.1-V17.03-BinderPatch
          path: |
            patchlab/output/*
            patchlab/report/*
          if-no-files-found: warn
          retention-days: 30
