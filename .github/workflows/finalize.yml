name: Finalize Xiaomi Health Research

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-finalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    name: Align, sign and verify APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"

      - name: Preflight candidate APK
        shell: bash
        run: |
          set -euo pipefail
          APK=input/xiaomi_health_research_ru_unsigned_candidate.apk
          test -s "$APK"
          mkdir -p output work
          unzip -t "$APK" >/dev/null
          if unzip -l "$APK" | grep -Eq 'META-INF/(MANIFEST\.MF|[^/]+\.(SF|RSA|DSA))$'; then
            echo "ERROR: candidate contains legacy JAR-signing metadata"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" > output/source-badging.txt
          grep -q '^package:' output/source-badging.txt
          sha256sum "$APK" | tee output/source-SHA256SUM.txt

      - name: Align APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f -P 4 -v 4 input/xiaomi_health_research_ru_unsigned_candidate.apk work/aligned.apk
          "$BT/zipalign" -c -P 4 -v 4 work/aligned.apk

      - name: Generate isolated test signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore work/test-release.jks \
            -storepass changeit -keypass changeit \
            -alias release -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Mihealthreserch Test,O=Mihealthreserch,C=RU"

      - name: Sign APK V1 V2 V3
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks work/test-release.jks \
            --ks-pass pass:changeit --key-pass pass:changeit \
            --ks-key-alias release \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out output/XiaomiHealthResearch_1.4.6_RU_FINAL.apk \
            work/aligned.apk

      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          FINAL=output/XiaomiHealthResearch_1.4.6_RU_FINAL.apk
          "$BT/zipalign" -c -P 4 -v 4 "$FINAL"
          "$BT/apksigner" verify --verbose --print-certs "$FINAL" | tee output/apksigner-verify.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' output/apksigner-verify.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' output/apksigner-verify.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' output/apksigner-verify.txt
          "$BT/aapt2" dump badging "$FINAL" > output/final-badging.txt
          unzip -t "$FINAL" >/dev/null
          sha256sum "$FINAL" | tee output/SHA256SUM.txt

      - name: Upload finalized APK
        uses: actions/upload-artifact@v4
        with:
          name: XiaomiHealthResearch-1.4.6-RU-FINAL
          if-no-files-found: error
          path: |
            output/XiaomiHealthResearch_1.4.6_RU_FINAL.apk
            output/*.txt

  emulator:
    name: ARM64 Android emulator smoke test
    needs: finalize
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: XiaomiHealthResearch-1.4.6-RU-FINAL
          path: output

      - name: Android ARM64 emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: arm64-v8a
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -uo pipefail
            APK=output/XiaomiHealthResearch_1.4.6_RU_FINAL.apk
            PKG=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" output/final-badging.txt | head -n 1)
            ACT=$(sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p" output/final-badging.txt | head -n 1)
            test -n "$PKG"
            echo "PACKAGE=$PKG" | tee emulator-package.txt
            echo "ACTIVITY=$ACT" | tee -a emulator-package.txt
            adb wait-for-device
            adb shell getprop ro.build.version.sdk | tee emulator-sdk.txt
            adb shell getprop ro.product.cpu.abilist | tee emulator-abi.txt
            set +e
            adb install -r "$APK" > emulator-install.txt 2>&1
            INSTALL_RC=$?
            set -e
            cat emulator-install.txt
            test "$INSTALL_RC" -eq 0
            adb shell pm path "$PKG" | tee emulator-package-path.txt
            set +e
            if [ -n "$ACT" ]; then
              adb shell am start -W -n "$PKG/$ACT" > emulator-launch.txt 2>&1
            else
              adb shell monkey -p "$PKG" 1 > emulator-launch.txt 2>&1
            fi
            LAUNCH_RC=$?
            set -e
            cat emulator-launch.txt
            sleep 10
            adb shell dumpsys package "$PKG" > emulator-package-dumpsys.txt 2>&1 || true
            adb logcat -d -t 2000 > emulator-logcat.txt || true
            echo "INSTALL_RC=$INSTALL_RC" | tee emulator-result.txt
            echo "LAUNCH_RC=$LAUNCH_RC" | tee -a emulator-result.txt
            if grep -Eq 'FATAL EXCEPTION|Process: '"$PKG"'.*has died' emulator-logcat.txt; then
              echo "APP_CRASH_DETECTED=true" | tee -a emulator-result.txt
              exit 1
            fi
            test "$LAUNCH_RC" -eq 0
            echo "APP_CRASH_DETECTED=false" | tee -a emulator-result.txt
            echo "SMOKE_TEST=PASS" | tee -a emulator-result.txt

      - name: Upload emulator diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-diagnostics
          if-no-files-found: ignore
          path: emulator-*.txt
