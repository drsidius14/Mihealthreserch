name: V16 Handoff Archive

on:
  workflow_dispatch:
  push:
    branches:
      - v16-handoff
    paths:
      - '.github/workflows/v16_handoff_archive.yml'

permissions:
  contents: read
  actions: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: v13-build

      - name: Assemble handoff package
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p dist/MiHealthResearch_V16_Handoff/repair
          mkdir -p dist/MiHealthResearch_V16_Handoff/.github/workflows
          OUT=dist/MiHealthResearch_V16_Handoff

          cp input/xiaomi_health_research_ru_candidate_v5.apk "$OUT/"
          cp README.md README_GITHUB_BUILD.md REPAIR_README.txt "$OUT/" 2>/dev/null || true
          cp V14* V15* V16* "$OUT/" 2>/dev/null || true

          cp repair/v13_* "$OUT/repair/" 2>/dev/null || true
          cp repair/v11_translations.json repair/v12_translations.json "$OUT/repair/" 2>/dev/null || true
          cp repair/reference_local_v10_7.json repair/verify_final.py "$OUT/repair/" 2>/dev/null || true

          cp .github/workflows/deep_test.yml .github/workflows/v13.yml "$OUT/.github/workflows/" 2>/dev/null || true

          test -s "$OUT/xiaomi_health_research_ru_candidate_v5.apk"
          find "$OUT" -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS.txt"

          {
            echo "Source repository: drsidius14/Mihealthreserch"
            echo "Source branch: v13-build"
            echo "Source commit: $(git rev-parse HEAD)"
            echo "Archive generated by GitHub Actions"
          } > "$OUT/PROVENANCE.txt"

          cd dist
          zip -qr ../MiHealthResearch_V16_Handoff.zip MiHealthResearch_V16_Handoff
          cd ..
          sha256sum MiHealthResearch_V16_Handoff.zip

      - name: Upload handoff ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MiHealthResearch_V16_Handoff
          path: MiHealthResearch_V16_Handoff.zip
          if-no-files-found: error
          retention-days: 30
