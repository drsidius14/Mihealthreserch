name: V16 Handoff Archive

on:
  workflow_dispatch:
  push:
    branches:
      - v16-handoff
    paths:
      - '.github/workflows/v16_handoff_archive.yml'

permissions:
  contents: read
  actions: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair source
        uses: actions/checkout@v4
        with:
          ref: v13-build
          path: source

      - name: Checkout original APK inputs
        uses: actions/checkout@v4
        with:
          ref: v10-build
          path: source-v10

      - name: Assemble and verify handoff
        shell: bash
        run: |
          set -euo pipefail

          SRC=source
          OLD=source-v10
          OUT=dist/MiHealthResearch_V16_Handoff

          rm -rf dist
          mkdir -p "$OUT/repair" "$OUT/input" "$OUT/.github/workflows"

          # Candidate APK from repair source.
          test -s "$SRC/input/xiaomi_health_research_ru_candidate_v5.apk"
          cp "$SRC/input/xiaomi_health_research_ru_candidate_v5.apk" "$OUT/"

          # Original APK inputs from the branch used by the build workflow.
          test -s "$OLD/input/XiaomiHealthResearch_1.4.6_CN_CONTROL.apk"
          test -s "$OLD/input/XiaomiHealthResearch_1.4.6_RU_V8.apk"
          cp "$OLD/input/XiaomiHealthResearch_1.4.6_CN_CONTROL.apk" "$OUT/input/"
          cp "$OLD/input/XiaomiHealthResearch_1.4.6_RU_V8.apk" "$OUT/input/"

          # Repair scripts and verification dependencies.
          cp "$SRC"/repair/v13_* "$OUT/repair/"
          cp "$SRC/repair/repair_v8.py" "$OUT/repair/"
          cp "$SRC/repair/v11_translations.json" "$SRC/repair/v12_translations.json" "$OUT/repair/"
          cp "$SRC/repair/reference_local_v10_7.json" "$SRC/repair/verify_final.py" "$OUT/repair/"

          # Build/test workflows.
          cp "$SRC/.github/workflows/v13.yml" "$SRC/.github/workflows/deep_test.yml" "$OUT/.github/workflows/"

          # Documentation, when present.
          for f in README.md README_GITHUB_BUILD.md REPAIR_README.txt V14* V15* V16*; do
            for srcfile in "$SRC"/$f; do
              if [ -f "$srcfile" ]; then cp "$srcfile" "$OUT/"; fi
            done
          done

          # Required-file checks: fail instead of silently producing an incomplete ZIP.
          test -s "$OUT/xiaomi_health_research_ru_candidate_v5.apk"
          test -s "$OUT/repair/repair_v8.py"
          test -s "$OUT/repair/verify_final.py"
          test -s "$OUT/repair/v13_selftest.py"
          test -s "$OUT/.github/workflows/v13.yml"
          test -s "$OUT/input/XiaomiHealthResearch_1.4.6_CN_CONTROL.apk"
          test -s "$OUT/input/XiaomiHealthResearch_1.4.6_RU_V8.apk"
          grep -q 'from repair_v8 import' "$OUT/repair/verify_final.py"

          # Record exact source revisions.
          {
            echo "Repository: drsidius14/Mihealthreserch"
            echo "Repair source branch: v13-build"
            echo "Repair source commit: $(git -C "$SRC" rev-parse HEAD)"
            echo "APK input branch: v10-build"
            echo "APK input commit: $(git -C "$OLD" rev-parse HEAD)"
            echo "Created by GitHub Actions."
          } > "$OUT/PROVENANCE.txt"

          # Run included self-tests and compile Python scripts.
          python3 -m compileall -q "$OUT/repair"
          python3 "$OUT/repair/v13_selftest.py"
          if [ -f "$OUT/repair/v13_localize_smali.py" ]; then
            python3 "$OUT/repair/v13_localize_smali.py" --self-test
          fi
          if [ -f "$OUT/repair/v13_compare_smali.py" ]; then
            python3 "$OUT/repair/v13_compare_smali.py" --self-test
          fi

          # Manifest includes provenance and every packaged file except itself.
          find "$OUT" -type f ! -name SHA256SUMS.txt -print0 |
            sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS.txt"

          cd dist
          zip -qr ../MiHealthResearch_V16_Handoff.zip MiHealthResearch_V16_Handoff
          cd ..

          # Validate ZIP structure and required entries.
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          p = Path("dist/../MiHealthResearch_V16_Handoff.zip")
          with zipfile.ZipFile(p) as z:
              bad = z.testzip()
              assert bad is None, f"Corrupt ZIP entry: {bad}"
              names = set(z.namelist())
              required = [
                  "MiHealthResearch_V16_Handoff/repair/repair_v8.py",
                  "MiHealthResearch_V16_Handoff/repair/verify_final.py",
                  "MiHealthResearch_V16_Handoff/SHA256SUMS.txt",
                  "MiHealthResearch_V16_Handoff/PROVENANCE.txt",
                  "MiHealthResearch_V16_Handoff/input/XiaomiHealthResearch_1.4.6_CN_CONTROL.apk",
                  "MiHealthResearch_V16_Handoff/input/XiaomiHealthResearch_1.4.6_RU_V8.apk",
              ]
              missing = [x for x in required if x not in names]
              assert not missing, f"Missing archive entries: {missing}"
              print(f"ZIP OK: {len(names)} entries")
          PY

          sha256sum MiHealthResearch_V16_Handoff.zip

      - name: Upload verified handoff ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MiHealthResearch_V16_Handoff_v2
          path: MiHealthResearch_V16_Handoff.zip
          if-no-files-found: error
          retention-days: 30
